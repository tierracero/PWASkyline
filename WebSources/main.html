        <script>
            window.tcInitialLoaderIsActive = true;
            window.tcPendingInitialLoadingText = "Cargando...";
            window.tcInitialLoadingState = { mode: "waiting", progress: null, error: false };

            function renderInitialLoadingProgress() {
                if (!window.tcInitialLoaderIsActive) return;
                const state = window.tcInitialLoadingState;
                const bar = document.querySelector("#element_03 .progress-bar");
                const progress = document.getElementById("element_03");
                const label = document.getElementById("initial-loading-percent");
                if (!bar || !progress || !label) return;
                bar.classList.toggle("progress-bar-indeterminate", state.mode === "indeterminate");
                bar.classList.toggle("progress-bar-determinate", state.mode === "determinate");
                if (state.progress !== null) {
                    bar.style.width = state.progress + "%";
                    progress.setAttribute("aria-valuenow", state.progress);
                } else {
                    bar.style.removeProperty("width");
                    progress.removeAttribute("aria-valuenow");
                }
                label.classList.toggle("error", state.error);
                label.innerText = state.error
                    ? "No se pudo cargar. Recargue la página para reintentar."
                    : state.progress === null ? "CONECTANDO" : state.progress + "%";
            }

            function reportInitialAsset(resource) {
                if (!window.tcInitialLoaderIsActive) {
                    return;
                }

                const resourceType = {
                    style: "CSS",
                    script: "JS",
                    image: "IMG"
                }[resource.getAttribute("as")] || "recurso";
                const loadingText = `Cargando ${resourceType}`;
                const loadingLabel = document.getElementById("initial-loading-label");

                window.tcPendingInitialLoadingText = loadingText;
                if (loadingLabel) {
                    loadingLabel.innerText = loadingText;
                }
            }

            document.addEventListener("DOMContentLoaded", () => {
                const loadingLabel = document.getElementById("initial-loading-label");
                if (loadingLabel && window.tcInitialLoaderIsActive) {
                    loadingLabel.innerText = window.tcPendingInitialLoadingText;
                }
                renderInitialLoadingProgress();
            });
        </script>

        <script>
            function removeInitalElements(){
                window.tcInitialLoaderIsActive = false;
                const element_01 = document.getElementById("element_01");
                const element_02 = document.getElementById("element_02");
                const element_03 = document.getElementById("element_03");

                [element_02, element_03].forEach((element) => {
                    element?.classList.add("initial-loader-exit");
                });

                window.setTimeout(() => {
                    element_01?.remove();
                    element_02?.remove();
                    element_03?.remove();
                }, 220);
            }
            function goToLogin(){
                window.location = `login`
            }
            document.addEventListener('WASMLoadingStarted', () => {
                window.tcInitialLoadingState.mode = "determinate";
                renderInitialLoadingProgress();
            });
            document.addEventListener('WASMLoadingStartedWithoutProgress', () => {
                window.tcInitialLoadingState.mode = "indeterminate";
                window.tcInitialLoadingState.progress = null;
                renderInitialLoadingProgress();
            });
            document.addEventListener('WASMLoadingProgress', (event) => {
                const progress = Number(event.detail);
                if (!Number.isFinite(progress)) return;
                window.tcInitialLoadingState.mode = "determinate";
                window.tcInitialLoadingState.progress = Math.max(0, Math.min(100, progress));
                renderInitialLoadingProgress();
            });
            document.addEventListener('WASMLoadingError', () => {
                window.tcInitialLoadingState.error = true;
                window.tcInitialLoadingState.mode = "waiting";
                renderInitialLoadingProgress();
            });
        </script>
