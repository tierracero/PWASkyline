        <script>
            window.tcInitialLoaderIsActive = true;
            window.tcPendingInitialLoadingText = "Cargando...";

            function reportInitialAsset(resource) {
                if (!window.tcInitialLoaderIsActive) {
                    return;
                }

                const resourceType = {
                    style: "CSS",
                    script: "JS",
                    image: "IMG"
                }[resource.getAttribute("as")] || "recurso";
                const resourceURL = new URL(resource.href, window.location.href);
                const resourceName = decodeURIComponent(resourceURL.pathname.split("/").pop());
                const loadingText = `Cargando ${resourceType}`;
                const loadingLabel = document.getElementById("initial-loading-label");

                window.tcPendingInitialLoadingText = loadingText;
                if (loadingLabel) {
                    loadingLabel.innerText = loadingText;
                }
            }

            document.addEventListener("DOMContentLoaded", () => {
                const loadingLabel = document.getElementById("initial-loading-label");
                if (loadingLabel && window.tcInitialLoaderIsActive) {
                    loadingLabel.innerText = window.tcPendingInitialLoadingText;
                }
            });
        </script>

        <script>
            function removeInitalElements(){
                window.tcInitialLoaderIsActive = false;
                const element_01 = document.getElementById("element_01");
                const element_02 = document.getElementById("element_02");
                const element_03 = document.getElementById("element_03");
                element_01.remove(); 
                element_02.remove(); 
                element_03.remove(); 
            }
            function goToLogin(){
                window.location = `login`
            }
            document.addEventListener('WASMLoadingStarted', (event) => {
                const progress = document.querySelector('.progress-bar');
                progress.classList.add("progress-bar-determinate");
            });
            document.addEventListener('WASMLoadingStartedWithoutProgress', (event) => {
                const progress = document.querySelector('.progress-bar');
                progress.classList.add("progress-bar-indeterminate");
            });
            document.addEventListener('WASMLoadingProgress', (event) => {
                const bar = document.querySelector('.progress-bar');
                bar.style.width = '' + event.detail + '%';
                const label = document.querySelector('h4');
                label.innerText = event.detail + '%';
            });
            document.addEventListener('WASMLoadingError', (event) => {
                const label = document.querySelector('h4');
                label.classList.add("error");
                label.innerText = 'Unable to load application, please try to reload page';
            });
        </script>

    <body>
        <style id="element_01">
            * { box-sizing: border-box; }
            body {
                background-color: #0E1B28;
                flex-direction: column;
                font-family: system, 'apple-system', 'San Francisco', 'Roboto', 'Segoe UI', 'Helvetica Neue', 'Lucida Grande', sans-serif;
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                margin: 0;
            }
            h3 { color: #d5d5d5; }
            h4 { color: #dfdfdf; }
            .error { color: #ff2b2b!important; }
            .progress {
                position: fixed;
                left: 0px;
                top: 0px;
                height: 3px;
                width: 100%;
            }
            .progress-bar { color: #fff; height: 100%; }
            @keyframes sub-bar {
                0% { transform: scaleX(5) translateX(-60%); }
                40% { transform: scaleX(33) translateX(-50%); }
                100% { transform: scaleX(0) translateX(-50%); }
            }
            @keyframes bar {
                0% { transform: translateX(0); }
                100% { transform: translateX(100%); }
            }
            .progress-bar-indeterminate {
                animation: bar 1.8s ease infinite;
                width: 100%;
            }
            .progress-bar-indeterminate::before, .progress-bar-indeterminate::after {
                position: absolute;
                content: "";
                width: 1%;
                min-width: 0.5px;
                height: 100%;
                background: linear-gradient(to left, #00ffff, #1379f4);
                animation: sub-bar 1.8s ease infinite;
                transform-origin: right;
            }
            .progress-bar-determinate {
                display: flex;
                align-items: center;
                justify-content: center;
                width: 0;
                background: linear-gradient(to left, #00ffff, #1379f4);
            }
            #element_02 {
                overflow: hidden;
                isolation: isolate;
                background:
                    radial-gradient(circle at 15% 48%, rgba(9, 67, 110, 0.14), transparent 30%),
                    radial-gradient(circle at 78% 42%, rgba(10, 42, 82, 0.16), transparent 34%),
                    linear-gradient(120deg, #050a0f 0%, #07111c 52%, #030509 100%);
            }
            #element_02 table {
                position: relative;
                z-index: 2;
            }
            #element_02::before,
            #element_02::after {
                position: absolute;
                z-index: 0;
                content: "";
                pointer-events: none;
            }
            #element_02::before {
                inset: -30%;
                opacity: 0.72;
                background:
                    radial-gradient(ellipse at 18% 48%, rgba(9, 69, 113, 0.24), transparent 24%),
                    radial-gradient(ellipse at 47% 28%, rgba(8, 47, 86, 0.2), transparent 22%),
                    radial-gradient(ellipse at 76% 66%, rgba(12, 37, 72, 0.23), transparent 28%),
                    repeating-linear-gradient(
                        112deg,
                        transparent 0 15%,
                        rgba(8, 47, 84, 0.1) 15.5% 20%,
                        transparent 20.5% 32%
                    );
                filter: blur(20px) saturate(112%);
                animation: loading-background-drift 15s ease-in-out infinite alternate;
            }
            #element_02::after {
                inset: -18% -35%;
                opacity: 0.55;
                background: linear-gradient(
                    112deg,
                    transparent 31%,
                    rgba(9, 69, 113, 0.03) 38%,
                    rgba(8, 54, 96, 0.18) 47%,
                    rgba(11, 35, 67, 0.1) 55%,
                    transparent 66%
                );
                mix-blend-mode: screen;
                animation: loading-background-sweep 10s ease-in-out infinite;
            }
            @keyframes loading-background-drift {
                0% { transform: translate3d(-6%, -3%, 0) scale(1.04) rotate(-1deg); }
                50% { transform: translate3d(4%, 2%, 0) scale(1.1) rotate(1deg); }
                100% { transform: translate3d(-1%, 6%, 0) scale(1.06) rotate(-0.5deg); }
            }
            @keyframes loading-background-sweep {
                0%, 12% { transform: translate3d(-28%, 0, 0) skewX(-13deg); }
                50% { transform: translate3d(7%, 0, 0) skewX(-13deg); }
                88%, 100% { transform: translate3d(30%, 0, 0) skewX(-13deg); }
            }
            .loading-logo {
                position: relative;
                display: inline-flex;
                align-items: center;
                justify-content: center;
                width: 256px;
                max-width: 65vw;
                min-height: 76px;
                isolation: isolate;
            }
            .loading-logo img {
                position: relative;
                z-index: 2;
                display: block;
                width: 100%;
                height: auto;
                filter: drop-shadow(0 0 12px rgba(19, 121, 244, 0.24));
            }
            .loading-logo-orbit {
                position: absolute;
                z-index: 1;
                left: 50%;
                top: 50%;
                border-style: solid;
                border-color: transparent;
                border-radius: 50%;
                pointer-events: none;
                will-change: transform;
            }
            .loading-logo-orbit-outer {
                width: 425px;
                height: 425px;
                margin: -212.5px 0 0 -212.5px;
                border-width: 4px;
                border-top-color: #22c5ff;
                border-right-color: #1379f4;
                border-bottom-color: #245cff;
                filter: drop-shadow(0 0 8px rgba(34, 197, 255, 0.5));
                animation: loading-logo-giro 1.7s linear infinite;
            }
            .loading-logo-orbit-inner {
                width: 347.5px;
                height: 347.5px;
                margin: -173.75px 0 0 -173.75px;
                border-width: 3px;
                border-top-color: #1379f4;
                border-bottom-color: #22c5ff;
                border-left-color: #245cff;
                filter: drop-shadow(0 0 6px rgba(19, 121, 244, 0.46));
                animation: loading-logo-giro-reverse 1.25s linear infinite;
            }
            @keyframes loading-logo-giro {
                from { transform: rotate(0deg); }
                to { transform: rotate(360deg); }
            }
            @keyframes loading-logo-giro-reverse {
                from { transform: rotate(360deg); }
                to { transform: rotate(0deg); }
            }
            @media (max-width: 480px) {
                .loading-logo-orbit-outer {
                    width: 350px;
                    height: 350px;
                    margin: -175px 0 0 -175px;
                }
                .loading-logo-orbit-inner {
                    width: 282.5px;
                    height: 282.5px;
                    margin: -141.25px 0 0 -141.25px;
                }
            }
            @media (prefers-reduced-motion: reduce) {
                .loading-logo-orbit,
                #element_02::before,
                #element_02::after {
                    animation-play-state: paused;
                }
            }
        </style>
        <div id="element_02" style="position:absolute; width:100%; height: 100%; top: 0px; left: 0px">
            <table width="100%" height="100%"><tr><td align="center" valign="middle">
                <div class="loading-logo">
                    <span class="loading-logo-orbit loading-logo-orbit-outer" aria-hidden="true"></span>
                    <span class="loading-logo-orbit loading-logo-orbit-inner" aria-hidden="true"></span>
                    <img src="/skyline/media/logoTierraCeroLongWhite.svg" width="256px" alt="Tierra Cero">
                </div><br>
                <h3 id="initial-loading-label" style="font-size: 18px; margin-top:12px;">Cargando...</h3>
                <h4 style="font-size:16px; margin-top:12px;"></h4>
            </td></tr></table>
        </div>
        <div class="progress" id="element_03">
            <div class="progress-bar"></div>
        </div>
    </body>
